$:
  api_trigger_abicheck2:
    - docker:
        image: mingc/android-build-box:latest
      stages:
        - name: 编 APK + 产物内 ABI 自检 + 存档
          script: |
            sh scripts/ci-apk-stage.sh

  # ── 按需「只编译出包」（ISSUE #303 / #315 那两轮临时流水线的正式化）──────
  # 用户连问了几轮「直接编译拿包」，而那几轮走的是**临时**流水线：用
  # `POST /{repo}/-/build/start` 现传一份 config，不落盘、不改仓库 —— 拿得到
  # 包，但下次还得把那段 config 再拼一遍，且**没有任何东西记得它**。
  # 这一条把它落成正规入口：同一条命令，随时可触发。
  #
  # 为什么不复用 `api_trigger_abicheck2`：那条是**质量**门禁，一把跑完
  # `scripts/ci-apk-stage.sh` 里 240 份套件（十分钟量级）。而"想看一个能装的
  # 包"和"想验这版代码守不守得住"是两件事 —— 前者的等待时间不该被后者决定。
  # 两条**并存**，互不影响：既有的 `api_trigger_abicheck2` 一个字都没动。
  #
  # ⚠ 两件事必须同时成立，否则这条入口会变成静默失效（守卫
  #   `tools/run_apk_debug_entry_guard.sh` 钉着，不是靠这句注释）：
  #     ① 命令与 `ci-apk-stage.sh` 里既有的那条**逐字相同** —— 否则"正规入口"
  #        只是长得像既有链路，实际编的是别的东西，而两边都绿；
  #     ② 目标套件仍接在既有 stage 里 —— 只加一个入口、把出包那段挪走，
  #        等于把 240 份套件的质量门禁连同产品一起删掉，而入口照旧绿。
  api_trigger_apk_debug:
    - docker:
        image: mingc/android-build-box:latest
      stages:
        - name: 按需只编译出包（不跑守卫链）
          # 脚本正文原来内联在这里（约 170 KB，其中九成是判据说明注释）。CNB runner 把
          # 整个 script 当命令行参数交给 /bin/bash，超长就 fork/exec 报
          # "argument list too long" —— 脚本一行都没跑，构建直接红。
          # 正文移到 scripts/ci-apk-stage.sh，这里只留一句调用。
          script: |
            sh scripts/ci-apk-stage.sh

main:
  # ── 附件到期清扫（ISSUE #310）────────────────────────────────────────────
  # 用户问："我上传的附件和你贴出来的 apk 占的空间有限制么，在哪儿自己删"，
  # 并定了寿命："设 3 天就可以"。
  #
  # 为什么是"定时清扫"而不是"上传时设 ttl"：Issue/PR 评论附件的上传表单
  # 只有 name / size / content_type —— **没有 ttl 字段**。平台给 ttl 的只有
  # 附件插件那条通道（release / commit 附件），而那两样恰好不是本仓库
  # 长期占空间的东西。所以"3 天"落在这条每日任务上。
  #
  # ⚠ 负责人机制：定时任务的 CNB_TOKEN 以**最后修改本配置并推送的人**身份签发。
  #   清扫要 repo-manage:r（列）+ repo-manage:rw（删），所以负责人必须是
  #   仓库 Owner。若日后有人顺手改了 `.cnb.yml` 而他没有这两个 scope，
  #   任务会每天 403 —— 脚本会把 `repo-manage:r` 打出来，但**别把这条任务的
  #   负责人弄丢**才是根上的做法。
  "crontab: 30 4 * * *":
    - name: 附件到期清扫
      stages:
        - name: 删掉 3 天前上传的 Issue/PR 附件
          # 镜像只要 `python3` —— 脚本的全部 HTTP 都走 urllib（不用 curl / jq），
          # 所以 `python:3.12-slim` 就够了，也不必额外 apt 装东西。
          # ⚠ 别退回 `ubuntu:latest`：那个镜像**不带 python3**，任务会在
          #   `python3: not found` 上红 —— 而它长得像"清扫脚本有问题"，
          #   其实只是环境缺了一个解释器。
          image: python:3.12-slim
          # `--apply` 是**必须**的：不带它脚本只列清单、一条都不删，而日志全绿。
          # 这一条是本任务最像"已经在工作"的失效形态，所以由
          # `tools/run_prune_assets_guard.sh` 静态钉住。
          script: |
            DAYS=3 sh scripts/prune-issue-assets.sh --apply
