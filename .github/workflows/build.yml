name: build
on:
  push:
    branches: [main, 'fix/**']
    # 只在影响 APK 的改动上构建：docs/scripts/tools 下的内容与任何 .md 都不是构建输入
    # （已核实：本文件全文不引用它们，app/src/main/assets 下 .md 数量为 0，
    #  jniLibs 只取 vendor 里的 .so）。纯文档提交从此不必再写 [skip ci]。
    # 故意不忽略 .github/**：改 workflow 自身要真跑一次，用来验证配置没写坏。
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "scripts/**"
      - "tools/**"
      - ".gitignore"
      - "LICENSE"
  workflow_dispatch:

# 推理在应用进程内完成：预编译 librnllama 变体随仓库提交在 vendor/cui-llama.rn-v1.12.2（Gradle 以 jniLibs 源打包），
# HTP 段库预置在 app/src/main/assets/ggml-hexagon/。
# 因此 CI 不需要从源码编译 llama.cpp，只用 NDK 通过 CMake 编出 llama_jni.cpp 的胶水层（每个 CPU 特性变体一个
# llmjni_<变体> 壳）与 libcpufeat，再连同上述 .so 一起打进 APK。

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # packages 默认值含 legacy `tools`，Google 已下架该包（sdkmanager 报
      # "Failed to find package 'tools'" 并 exit 1），故显式置空，只保留 license 接受与 PATH。
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install NDK & CMake
        run: |
          sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          # AGP 8.7.3 兼容 Gradle 8.x；显式固定避免 setup-gradle 装到 9.x
          gradle-version: "8.10.2"
      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon
      # 版本号与提交号写进构建摘要：便于确认 APK 到底来自哪次提交
      # （历史上出现过 fix 分支的构建 checkout 到 main 的情况，这一步用来一眼识别）
      - name: Report APK provenance
        run: |
          {
            echo "### APK 来源"
            echo ""
            echo "- ref: \`${GITHUB_REF_NAME}\`"
            echo "- sha: \`${GITHUB_SHA}\`"
            grep -E 'versionCode|versionName' app/build.gradle.kts | head -4
            ls -l app/build/outputs/apk/debug/app-debug.apk
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
